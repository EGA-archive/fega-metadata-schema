name: Schema lint

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: schema-lint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install dependencies and project
        run: |
          python -m pip install -r requirements-lock.txt
          python -m pip install --no-deps -e .
      - name: Start Biovalidator from main
        uses: ./.github/actions/setup-biovalidator
      - name: Lint all schemas and check custom-keyword examples
        run: python scripts/py/lint_schemas.py --root . --resolution-root schemas --check-api --validator-url http://localhost:3020/validate schemas -v
      - name: Upload Biovalidator log after failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: {name: schema-lint-biovalidator-log, path: biovalidator.log, if-no-files-found: warn}
      - name: Stop Biovalidator
        if: always()
        run: test ! -f biovalidator.pid || kill "$(cat biovalidator.pid)" || true
