name: Schema examples
# Checks valid and invalid JSON examples against Biovalidator's main branch. It catches schemas that accept or reject the wrong data.

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions: {contents: read}
concurrency:
  group: schema-examples-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  examples:
    name: Schema examples
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out tested snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {ref: '${{ github.event.pull_request.head.sha || github.sha }}', fetch-depth: 0}
      - name: Select release R1 snapshot
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'release/v')
        run: |
          base='${{ github.event.pull_request.base.sha }}'
          test "$(git rev-list --count "$base..HEAD")" -eq 2
          test "$(git rev-parse HEAD^^)" = "$base"
          git checkout --detach HEAD^
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: '3.12', cache: pip, cache-dependency-path: requirements-lock.txt}
      - name: Install validation tooling
        run: python -m pip install -r requirements-lock.txt && python -m pip install --no-deps -e .
      - name: Start Biovalidator from main
        uses: ./.github/actions/setup-biovalidator
      - name: Validate JSON Schema examples
        run: |
          python scripts/py/validate_examples.py \
            --root schemas/entities \
            --url "http://localhost:3020/validate" \
            --summary-dir validation-summaries/entities \
            -v
          
          python scripts/py/validate_examples.py \
            --root schemas \
            --entity graph \
            --url "http://localhost:3020/validate" \
            --summary-dir validation-summaries/graph \
            -v
      - name: Upload example summaries
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: {name: schema-example-summaries, path: validation-summaries, if-no-files-found: warn}
      - name: Upload Biovalidator log after failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: {name: schema-examples-biovalidator-log, path: biovalidator.log, if-no-files-found: warn}
      - name: Stop Biovalidator
        if: always()
        run: test ! -f biovalidator.pid || kill "$(cat biovalidator.pid)" || true
