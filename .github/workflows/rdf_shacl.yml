name: RDF SHACL
# Validates RDF examples against the project's SHACL shapes. It catches metadata that violates the required RDF constraints.

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions: {contents: read}
concurrency:
  group: rdf-shacl-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  shacl:
    name: RDF SHACL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out tested snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {ref: '${{ github.event.pull_request.head.sha || github.sha }}', fetch-depth: 0}
      - name: Select release R1 snapshot
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'release/v')
        run: |
          base='${{ github.event.pull_request.base.sha }}'
          test "$(git rev-list --count "$base..HEAD")" -eq 2
          test "$(git rev-parse HEAD^^)" = "$base"
          git checkout --detach HEAD^
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: '3.12', cache: pip, cache-dependency-path: requirements-lock.txt}
      - name: Install validation tooling
        run: python -m pip install -r requirements-lock.txt && python -m pip install --no-deps -e .
      - name: Validate RDF with SHACL
        run: |
          python scripts/py/validate_rdf_shacl.py \
            --root schemas/entities \
            --entity dataset \
            --shapes standards/rdf/dcatap/release-3.0.0/shapes.ttl \
              standards/rdf/healthdcat-ap/release-6.0.0/shacl/non-public-shapes-v6.ttl \
            --required-root-type http://www.w3.org/ns/dcat#Dataset \
            --summary-dir validation-summaries \
            -v
      - name: Upload SHACL summary
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: {name: rdf-shacl-summary, path: validation-summaries, if-no-files-found: warn}
