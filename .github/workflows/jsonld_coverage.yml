name: JSON-LD coverage
# Checks that the schemas have the context terms and frame fields needed for JSON-LD use. It highlights missing or unexpected coverage.

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions: {contents: read}
concurrency:
  group: jsonld-coverage-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: JSON-LD coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out tested snapshot
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with: {ref: '${{ github.event.pull_request.head.sha || github.sha }}', fetch-depth: 0}
      - name: Select release R1 snapshot
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'release/v')
        run: |
          base='${{ github.event.pull_request.base.sha }}'
          test "$(git rev-list --count "$base..HEAD")" -eq 2
          test "$(git rev-parse HEAD^^)" = "$base"
          git checkout --detach HEAD^
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: {python-version: '3.12', cache: pip, cache-dependency-path: requirements-lock.txt}
      - name: Install validation tooling
        run: python -m pip install -r requirements-lock.txt && python -m pip install --no-deps -e .
      - name: Validate JSON-LD coverage
        run: |
          python scripts/py/validate_jsonld_coverage.py \
            --root schemas/entities \
            --summary-dir validation-summaries \
            -v
      - name: Upload coverage summary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: {name: jsonld-coverage-summary, path: validation-summaries, if-no-files-found: warn}
