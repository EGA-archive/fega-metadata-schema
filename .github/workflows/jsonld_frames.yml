name: JSON-LD frames
# Sends valid examples through JSON-LD framing and round-trip checks. It catches data that cannot be reconstructed reliably after framing.

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions: {contents: read}
concurrency:
  group: jsonld-frames-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frames:
    name: JSON-LD frames
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out tested snapshot
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with: {ref: '${{ github.event.pull_request.head.sha || github.sha }}', fetch-depth: 0}
      - name: Select release R1 snapshot
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'release/v')
        run: |
          base='${{ github.event.pull_request.base.sha }}'
          test "$(git rev-list --count "$base..HEAD")" -eq 2
          test "$(git rev-parse HEAD^^)" = "$base"
          git checkout --detach HEAD^
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: {python-version: '3.12', cache: pip, cache-dependency-path: requirements-lock.txt}
      - name: Install validation tooling
        run: python -m pip install -r requirements-lock.txt && python -m pip install --no-deps -e .
      - name: Start Biovalidator from main
        uses: ./.github/actions/setup-biovalidator
      - name: Validate JSON-LD frame round trips
        run: |
          python scripts/py/validate_jsonld_frames.py \
            --root schemas/entities \
            --url http://localhost:3020/validate \
            --summary-dir validation-summaries/entities \
            -v
          
          python scripts/py/validate_jsonld_frames.py \
            --root schemas \
            --entity graph \
            --url http://localhost:3020/validate \
            --summary-dir validation-summaries/graph \
            -v
      - name: Upload frame summaries
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: {name: jsonld-frame-summaries, path: validation-summaries, if-no-files-found: warn}
      - name: Upload Biovalidator log after failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: {name: jsonld-frames-biovalidator-log, path: biovalidator.log, if-no-files-found: warn}
      - name: Stop Biovalidator
        if: always()
        run: test ! -f biovalidator.pid || kill "$(cat biovalidator.pid)" || true
