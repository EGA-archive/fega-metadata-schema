name: Schema compatibility
# Compares schema changes and checks that their declared version changes are high enough. It also verifies the release snapshot against its manifest.

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: schema-compatibility-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    name: Schema compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out tested snapshot
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with: {ref: '${{ github.event.pull_request.head.sha || github.sha }}', fetch-depth: 0}
      - name: Select release R1 snapshot
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'release/v')
        run: |
          base='${{ github.event.pull_request.base.sha }}'
          test "$(git rev-list --count "$base..HEAD")" -eq 2
          test "$(git rev-parse HEAD^^)" = "$base"
          git checkout --detach HEAD^
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: {python-version: '3.12', cache: pip, cache-dependency-path: requirements-lock.txt}
      - name: Install validation dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Install project
        run: python -m pip install --no-deps -e .
      - name: Check schema compatibility and meta version policy
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            if [[ "$GITHUB_HEAD_REF" == release/v* ]]; then
              tag=$(git show HEAD:build/release_manifest.json | jq -r .tag)
              test -n "$tag"; test "$tag" != null
              python scripts/py/release.py verify \
                --mode tag \
                --ref "$tag"
            else
              previous=$(mktemp -d)
              git archive "$BASE_SHA" | tar -x -C "$previous"
              body_file=$(mktemp)
              jq -r '.pull_request.body // ""' "$GITHUB_EVENT_PATH" > "$body_file"
              python scripts/py/release.py analyse \
                --previous "$previous" \
                --pr-body-file "$body_file" \
                --output schema-diff.json
            fi
          else
            python scripts/py/release.py verify \
              --mode development \
              --ref main
          fi
