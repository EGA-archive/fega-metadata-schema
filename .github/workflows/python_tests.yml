name: Python tests
# Runs the automated tests for the project's Python tools. It catches code regressions before changes are merged.

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out tested snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {ref: '${{ github.event.pull_request.head.sha || github.sha }}', fetch-depth: 0}
      - name: Select release R1 snapshot
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'release/v')
        run: |
          base='${{ github.event.pull_request.base.sha }}'
          test "$(git rev-list --count "$base..HEAD")" -eq 2
          test "$(git rev-parse HEAD^^)" = "$base"
          git checkout --detach HEAD^
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: '3.12', cache: pip, cache-dependency-path: requirements-lock.txt}
      - name: Install test dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Install project
        run: python -m pip install --no-deps -e .
      - name: Run Python tests
        run: python -m pytest
